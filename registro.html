<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Participantes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto !important; 
            /* AQUÍ PUEDES CAMBIAR EL FONDO POR TU GIF */
            background: radial-gradient(circle at top center, #1a1a1a 0%, #000 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px; 
        }
        
        .wrapper {
            width: 100%;
            max-width: 600px; 
            min-height: 100%; 
            margin: 0 auto;
            padding: 30px 20px 20px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            text-align: center;
        }

        /* --- ANIMACIONES --- */
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        @keyframes fadeInUpStagger {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .titulo-principal {
            font-size: 21px; 
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #e50000, #a30000);
            padding: 12px 23.5px 12px 25px; 
            border-radius: 50px; 
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            animation: popIn 0.8s ease-out, pulseRed 2.5s infinite; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: fit-content;
        }

        .busqueda-container {
            background: rgba(20, 20, 20, 0.95); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUpStagger 0.6s ease-out 0.2s backwards;
        }

        .busqueda-container input, .busqueda-container select {
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); 
            font-size: 16px; 
            background: rgba(0,0,0,0.5); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        .busqueda-container input:focus, .busqueda-container select:focus {
            border-color: #ffcc00; 
            outline: none; 
            background: rgba(0,0,0,0.8);
        }

        .btn-accion {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27), box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-accion:hover, .btn-accion:active {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.4);
        }

        .btn-volver {
            background: rgba(30, 30, 30, 0.6);
            color: #fff;
            padding: 10px 10px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 52px; 
            margin-top: 25px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27), background-color 0.3s, color 0.3s, border-color 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: fadeInUpStagger 0.6s ease-out 0.4s backwards;
        }

        .btn-volver:hover, .btn-volver:active {
            background-color: #ffcc00;
            color: #000;
            border-color: #ffcc00;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.4);
        }

        #resultado {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        
        <div class="titulo-principal">
            <i class="fa-solid fa-magnifying-glass" style="margin-right: 10px;"></i> Buscar Participante
        </div>
        
        <div class="busqueda-container">
            <select id="tipoVehiculo">
                <option value="autos">Autos</option>
                <option value="motos">Motos</option>
            </select>
            <input type="text" id="inputBusqueda" placeholder="Escribe el nombre y apellido...">
            <button class="btn-accion" onclick="buscar()">Buscar</button>
        </div>

        <div id="resultado"></div>

        <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>

    </div>

    <script>
        const URL_APG = "https://script.google.com/macros/s/AKfycbwzqj7cIlPQcXZA73gHE9YAGWB5ppeK_a13bwTd3fajVNRKSa7d7w5DcFqedxrSqm8Y9g/exec";

        function buscar() {
            var query = document.getElementById("inputBusqueda").value.trim();
            var tipo = document.getElementById("tipoVehiculo").value; 
            var contenedorResultados = document.getElementById("resultado");
            
            if (!query) {
                contenedorResultados.innerHTML = "<p style='color:#ffcc00; font-weight:600; font-size:16px;'><i class='fa-solid fa-triangle-exclamation'></i> Por favor ingresa un nombre.</p>";
                return;
            }

            contenedorResultados.innerHTML = "<p style='color:#aaa; font-size:16px;'><i class='fa-solid fa-spinner fa-spin'></i> Buscando en la base de datos...</p>";

            fetch(URL_APG + "?q=" + encodeURIComponent(query) + "&tipo=" + encodeURIComponent(tipo))
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        var html = "<h3 style='color:#00bcd4; font-size:18px; margin-bottom:15px;'>Participantes encontrados:</h3><ul style='list-style:none; padding:0; margin:0;'>";
                        
                        data.forEach(participante => {
                            // Se modificó height: auto, max-height y object-fit: contain para evitar recortes en celulares
                            var imagenHTML = (participante.imagen && (participante.imagen.includes(".") || participante.imagen.includes("/"))) 
                                ? `<img src="${participante.imagen}" style='width: 100%; height: auto; max-height: 350px; object-fit: contain; background: rgba(0,0,0,0.5); border-radius: 8px; margin-bottom: 12px;'>`
                                : `<div style='width: 100%; max-width: 350px; height: 180px; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; border-radius: 8px; margin: 0 auto 15px auto; border: 1px dashed rgba(255,255,255,0.1);'><i class="fa-regular fa-image" style="margin-right:6px;"></i> Foto no cargada</div>`;

                            html += `<li style='padding: 18px; background: rgba(20, 20, 20, 0.95); margin: 20px auto; width: 100%; box-sizing: border-box; border-radius: 16px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); animation: popIn 0.5s ease-out;'>
                                        ${imagenHTML}
                                        <div style='width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 5px;'>
                                            <span style='font-size: 16px;'><strong style='color:#ffcc00;'>Nombre:</strong> ${participante.nombre}</span>
                                            <span style='font-size: 15px;'><strong style='color:#00bcd4;'>Vehículo:</strong> ${participante.vehiculo}</span>
                                            <span style='font-size: 15px;'><strong style='color:#00bcd4;'>Modelo:</strong> ${participante.modelo}</span>
                                            <span style='font-size: 15px;'><strong style='color:#00bcd4;'>Color:</strong> ${participante.color}</span>
                                        </div>
                                     </li>`;
                        });
                        
                        html += "</ul>";
                        contenedorResultados.innerHTML = html;
                    } else {
                        var html = "<p style='color:#ff4d4d; font-size:16px; font-weight:600; margin-bottom:15px;'><i class='fa-solid fa-circle-xmark'></i> No se encontró al participante.</p>" +
                                   "<button class='btn-accion' style='background: linear-gradient(135deg, #28a745, #218838); box-shadow: 0 4px 15px rgba(40,167,69,0.3);' onclick='inscribirNuevo()'><i class='fa-brands fa-whatsapp'></i> ¡Inscribir nuevo participante!</button>";
                        contenedorResultados.innerHTML = html;
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    contenedorResultados.innerHTML = "<p style='color:#ff4d4d; font-weight:600;'><i class='fa-solid fa-triangle-exclamation'></i> Ocurrió un error al conectar con la base de datos.</p>";
                });
        }

        function inscribirNuevo() {
            var numeroWhatsApp = "5493825435137"; 
            var mensaje = encodeURIComponent("¡Hola! Quiero inscribir un nuevo participante.");
            
            window.location.href = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;
        }
    </script>
</body>
</html>
