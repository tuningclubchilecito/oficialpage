<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Participantes</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            margin: 0;
            overflow-x: hidden; /* Evita cualquier scroll horizontal accidental */
        }
        .barra-busqueda, .selector-tipo { 
            padding: 10px; 
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin-top: 10px;
        }
        .selector-tipo {
            background-color: #222;
            color: #fff;
            cursor: pointer;
        }
        .barra-busqueda { 
            width: 80%;
            max-width: 300px; 
        }
        .btn-accion {
            padding: 10px 20px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 5px;
            margin-top: 10px;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 10px 20px;
            background-color: #ffcc00;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: transform 0.3s ease;
        }
        .btn-volver:hover {
            transform: scale(1.1);
        }
        .controles-busqueda {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 0 15px;
        }
    </style>
</head>
<body>
    <h1>Buscar Participante</h1>
    
    <div class="controles-busqueda">
        <select id="tipoVehiculo" class="selector-tipo">
            <option value="autos">Autos</option>
            <option value="motos">Motos</option>
        </select>
        <input type="text" class="barra-busqueda" id="inputBusqueda" placeholder="Nombre y Apellido...">
        <button class="btn-accion" onclick="buscar()">Buscar</button>
    </div>

    <div id="resultado" style="margin-top: 20px; padding: 0 15px;"></div>

    <div>
        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </div>

    <script>
        // URL de tu Aplicación Web de Google Apps Script
        const URL_APG = "https://script.google.com/macros/s/AKfycbwzqj7cIlPQcXZA73gHE9YAGWB5ppeK_a13bwTd3fajVNRKSa7d7w5DcFqedxrSqm8Y9g/exec";

        function buscar() {
            var query = document.getElementById("inputBusqueda").value;
            var tipo = document.getElementById("tipoVehiculo").value; // Capturamos si seleccionó autos o motos
            var contenedorResultados = document.getElementById("resultado");
            
            if (!query) {
                contenedorResultados.innerHTML = "<p>Por favor ingresa un nombre o apellido.</p>";
                return;
            }

            contenedorResultados.innerHTML = "<p>Buscando en la base de datos...</p>";

            // Enviamos tanto el texto de búsqueda (q) como el tipo seleccionado (tipo)
            fetch(URL_APG + "?q=" + encodeURIComponent(query) + "&tipo=" + encodeURIComponent(tipo))
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        var html = "<h3>Participantes encontrados:</h3><ul style='list-style:none; padding:0; margin:0;'>";
                        
                        data.forEach(participante => {
                            // Tus medidas exactas conservadas intactas
                            var imagenHTML = (participante.imagen && (participante.imagen.includes(".") || participante.imagen.includes("/"))) 
                                ? `<img src="${participante.imagen}" style='width: 100%; max-width: 450px; height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: -18px;'>`
                                : `<div style='width: 100%; max-width: 350px; height: 180px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; border-radius: 8px; margin: 0 auto 15px auto;'>Foto no cargada</div>`;

                            html += `<li style='padding: 10px; background: #1a1a1a; margin: 20px auto; width: 100%; max-width: 450px; box-sizing: border-box; border-radius: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);'>
                                        ${imagenHTML}
                                        <div style='width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 0 5px;'>
                                            <span><strong>Nombre:</strong> ${participante.nombre}</span>
                                            <span><strong>Vehículo:</strong> ${participante.vehiculo}</span>
                                            <span><strong>Modelo:</strong> ${participante.modelo}</span>
                                            <span><strong>Color:</strong> ${participante.color}</span>
                                        </div>
                                     </li>`;
                        });
                        
                        html += "</ul>";
                        contenedorResultados.innerHTML = html;
                    } else {
                        var html = "<p>No se encontró al participante.</p>" +
                                   "<br><button class='btn-accion' onclick='inscribirNuevo()'>¡Inscribir nuevo participante!</button>";
                        contenedorResultados.innerHTML = html;
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    contenedorResultados.innerHTML = "<p style='color:red;'>Ocurrió un error al buscar.</p>";
                });
        }

        function inscribirNuevo() {
            var numeroWhatsApp = "5493825435137"; 
            var mensaje = encodeURIComponent("¡Hola! Quiero inscribir un nuevo participante.");
            
            window.location.href = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;
        }
    </script>
</body>
</html>
