<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Participantes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow-y: auto !important; background: radial-gradient(circle at top center, #1a1a1a 0%, #000 100%); color: #fff; font-family: 'Inter', sans-serif; font-size: 15px; }
        .wrapper { width: 100%; max-width: 600px; min-height: 100%; margin: 0 auto; padding: 30px 20px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }

        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
        @keyframes fadeInUpStagger { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

        .titulo-principal { font-size: 21px; font-weight: 800; color: #ffffff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; background: linear-gradient(135deg, #e50000, #a30000); padding: 12px 25px; border-radius: 50px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); animation: popIn 0.8s ease-out, pulseRed 2.5s infinite; width: fit-content; }
        
        .busqueda-container { background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(12px); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid rgba(255, 255, 255, 0.08); width: 100%; display: flex; flex-direction: column; gap: 12px; animation: fadeInUpStagger 0.6s ease-out 0.2s backwards; }
        .busqueda-container input, .busqueda-container select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-size: 16px; background: rgba(0,0,0,0.5); color: #fff; transition: 0.3s; }
        .busqueda-container input:focus, .busqueda-container select:focus { border-color: #ffcc00; outline: none; background: rgba(0,0,0,0.8); }

        .btn-accion { background: linear-gradient(135deg, #ffcc00, #e6b800); color: #000; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-accion:active { transform: translateY(-3px) scale(1.02); }
        .btn-inscribir { background: linear-gradient(135deg, #28a745, #218838); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 15px; display: flex; justify-content: center; gap: 8px; transition: 0.3s; }

        .btn-volver { background: rgba(30, 30, 30, 0.6); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 800; font-size: 16px; border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; margin-top: 25px; transition: 0.3s; }
        .btn-volver:hover { background-color: #ffcc00; color: #000; border-color: #ffcc00; }

        .galeria-wrapper { width: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; scrollbar-width: none; border-radius: 8px; }
        .galeria-wrapper::-webkit-scrollbar { display: none; }
        .galeria-wrapper img { scroll-snap-align: center; flex: 0 0 100%; width: 100%; height: auto; max-height: 350px; object-fit: contain; background: rgba(0,0,0,0.5); border-radius: 8px; }
        
        #resultado { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="titulo-principal"><i class="fa-solid fa-magnifying-glass" style="margin-right: 10px;"></i> Buscar Participante</div>
        <div class="busqueda-container">
            <select id="tipoVehiculo"><option value="autos">Autos</option><option value="motos">Motos</option></select>
            <input type="text" id="inputBusqueda" placeholder="Escribe el nombre y apellido...">
            <button class="btn-accion" onclick="buscar()">Buscar</button>
        </div>
        <div id="resultado"></div>
        <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU NUEVA IMPLEMENTACIÓN DE APPS SCRIPT
        const URL_APG = "https://script.google.com/macros/s/AKfycbwzqj7cIlPQcXZA73gHE9YAGWB5ppeK_a13bwTd3fajVNRKSa7d7w5DcFqedxrSqm8Y9g/exec";

        function obtenerUrlDirecta(url) {
            if (!url) return "";
            var match = url.match(/[-\w]{25,}/); 
            if (match && match[0]) return "https://lh3.googleusercontent.com/d/" + match[0] + "=s0";
            return url;
        }

        function buscar() {
            var query = document.getElementById("inputBusqueda").value.trim();
            var tipo = document.getElementById("tipoVehiculo").value; 
            var contenedorResultados = document.getElementById("resultado");
            
            if (!query) { contenedorResultados.innerHTML = "<p style='color:#ffcc00; font-weight:600;'><i class='fa-solid fa-triangle-exclamation'></i> Ingresa un nombre.</p>"; return; }
            contenedorResultados.innerHTML = "<p style='color:#aaa;'><i class='fa-solid fa-spinner fa-spin'></i> Buscando...</p>";

            fetch(URL_APG + "?q=" + encodeURIComponent(query) + "&tipo=" + encodeURIComponent(tipo))
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        var html = "<h3 style='color:#00bcd4; font-size:18px; margin-bottom:15px;'>Participantes encontrados:</h3><ul style='list-style:none; padding:0; margin:0;'>";
                        
                        data.forEach(p => {
                            var img1 = obtenerUrlDirecta(p.imagen);
                            var img2 = obtenerUrlDirecta(p.imagen2);
                            
                            var galeriaHTML = "";
                            if (img1 || img2) {
                                galeriaHTML += `<div class='galeria-wrapper'>`;
                                if (img1 && img1.length > 5) galeriaHTML += `<img src="${img1}">`;
                                if (img2 && img2.length > 5) galeriaHTML += `<img src="${img2}">`;
                                galeriaHTML += `</div>`;
                                
                                if (img1 && img2 && img1.length > 5 && img2.length > 5) {
                                    galeriaHTML += `<div style='font-size:11px; color:#aaa; margin-top:5px; text-align:center;'><i class='fa-solid fa-arrows-left-right'></i> Desliza para ver más fotos</div>`;
                                }
                            } else {
                                galeriaHTML = `<div style='width:100%; height:180px; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; color:#888; border-radius:8px; border:1px dashed rgba(255,255,255,0.1); margin-bottom:12px;'><i class="fa-regular fa-image" style="margin-right:6px;"></i> Foto no cargada</div>`;
                            }

                            html += `<li style='padding:18px; background:rgba(20,20,20,0.95); margin:20px 0; border-radius:16px; border:1px solid rgba(255,255,255,0.08); box-shadow:0 10px 30px rgba(0,0,0,0.7); animation:popIn 0.5s ease-out;'>
                                        ${galeriaHTML}
                                        <div style='display:flex; flex-direction:column; gap:8px; text-align:left; padding-top:12px;'>
                                            <span style='font-size:16px;'><strong style='color:#ffcc00;'>Nombre:</strong> ${p.nombre}</span>
                                            <span style='font-size:15px;'><strong style='color:#00bcd4;'>Vehículo:</strong> ${p.vehiculo}</span>
                                            <span style='font-size:15px;'><strong style='color:#00bcd4;'>Modelo:</strong> ${p.modelo}</span>
                                            <span style='font-size:15px;'><strong style='color:#00bcd4;'>Color:</strong> ${p.color}</span>
                                        </div>
                                     </li>`;
                        });
                        contenedorResultados.innerHTML = html + "</ul>";
                    } else {
                        contenedorResultados.innerHTML = "<p style='color:#ff4d4d; font-weight:600; margin-bottom:15px;'><i class='fa-solid fa-circle-xmark'></i> Participante no encontrado.</p><button class='btn-inscribir' onclick='inscribirNuevo()'><i class='fa-brands fa-whatsapp'></i> Inscribir nuevo participante</button>";
                    }
                })
                .catch(error => { contenedorResultados.innerHTML = "<p style='color:#ff4d4d; font-weight:600;'><i class='fa-solid fa-triangle-exclamation'></i> Error de conexión.</p>"; });
        }
        function inscribirNuevo() { window.location.href = `https://wa.me/5493825435137?text=` + encodeURIComponent("¡Hola! Quiero inscribir un nuevo participante."); }
    </script>
</body>
</html>
